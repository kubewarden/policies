name: "kubewarden-policy-gh-action-dependencies"
description: "Install all the binaries needed inside of GH action"
branding:
  icon: "package"
  color: "blue"
inputs:
  install-rust-sbom-tools:
    description: "If true, install cargo-auditable and auditable2cdx. The release uses them to make the SBOM of Rust policies."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
    - name: Install kwctl
      shell: bash
      run: |
        #!/bin/bash
        set -e
        source "${GITHUB_ACTION_PATH}/../../../versions.env"

        ASSET="kwctl-linux-x86_64"
        INSTALL_DIR=$HOME/.kwctl

        mkdir -p $INSTALL_DIR
        curl -sL https://github.com/kubewarden/adm-controller/releases/download/${KWCTL_VERSION}/$ASSET.zip -o $INSTALL_DIR/$ASSET.zip
        echo "${KWCTL_CHECKSUM}  $INSTALL_DIR/$ASSET.zip" | sha256sum -c -
        unzip -o $INSTALL_DIR/$ASSET.zip -d $INSTALL_DIR
        rm $INSTALL_DIR/$ASSET.zip

        mv $INSTALL_DIR/$ASSET $INSTALL_DIR/kwctl
        chmod 755 $INSTALL_DIR/kwctl
        echo $INSTALL_DIR >> $GITHUB_PATH

        $INSTALL_DIR/kwctl -V
    - name: Install bats
      shell: bash
      run: sudo apt install -y bats
    - name: Install SBOM generator tool
      shell: bash
      run: |
        #!/bin/bash
        set -e
        source "${GITHUB_ACTION_PATH}/../../../versions.env"

        INSTALL_DIR=$HOME/.syft

        mkdir -p $INSTALL_DIR

        curl -sL https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz -o $INSTALL_DIR/syft.tar.gz
        echo "${SYFT_CHECKSUM}  $INSTALL_DIR/syft.tar.gz" | sha256sum -c -
        tar xvf $INSTALL_DIR/syft.tar.gz -C $INSTALL_DIR
        rm $INSTALL_DIR/syft.tar.gz

        echo $INSTALL_DIR >> $GITHUB_PATH
    - name: Install binaryen tool
      shell: bash
      run: |
        #!/bin/bash
        set -e
        source "${GITHUB_ACTION_PATH}/../../../versions.env"

        INSTALL_DIR=$HOME/.binaryen

        mkdir -p $INSTALL_DIR

        curl -sL https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz -o $INSTALL_DIR/binaryen.tar.gz
        echo "${BINARYEN_CHECKSUM}  $INSTALL_DIR/binaryen.tar.gz" | sha256sum -c -
        tar xvf $INSTALL_DIR/binaryen.tar.gz -C $INSTALL_DIR
        mv $INSTALL_DIR/binaryen-${BINARYEN_VERSION}/bin/* $INSTALL_DIR
        rm $INSTALL_DIR/binaryen.tar.gz
        rm -rf $INSTALL_DIR/binaryen-${BINARYEN_VERSION}

        echo $INSTALL_DIR >> $GITHUB_PATH
    - name: Setup rust toolchain
      run: |
        rustup toolchain install stable --profile minimal --target wasm32-wasip1
        rustup override set stable
      shell: bash
    - name: Install Rust SBOM tools
      if: ${{ inputs.install-rust-sbom-tools == 'true' }}
      shell: bash
      run: |
        set -e
        source "${GITHUB_ACTION_PATH}/../../../versions.env"
        ASSET="cargo-auditable-x86_64-unknown-linux-musl"
        INSTALL_DIR=$HOME/.cargo-auditable

        mkdir -p $INSTALL_DIR
        curl -sL https://github.com/rust-secure-code/cargo-auditable/releases/download/${CARGO_AUDITABLE_VERSION}/${ASSET}.tar.xz -o $INSTALL_DIR/${ASSET}.tar.xz
        echo "${CARGO_AUDITABLE_CHECKSUM}  $INSTALL_DIR/${ASSET}.tar.xz" | sha256sum -c -
        tar xJf $INSTALL_DIR/${ASSET}.tar.xz --strip-components=1 -C $INSTALL_DIR
        rm $INSTALL_DIR/${ASSET}.tar.xz
        echo $INSTALL_DIR >> $GITHUB_PATH

        # auditable2cdx has no prebuilt binary, so it is built from source.
        cargo install --locked --version "${AUDITABLE2CDX_VERSION}" auditable2cdx
    - name: Install tinygo
      shell: bash
      run: |
        set -e
        source "${GITHUB_ACTION_PATH}/../../../versions.env"
        TINYGO_DEB="tinygo_${TINYGO_VERSION#v}_amd64.deb"
        wget https://github.com/tinygo-org/tinygo/releases/download/${TINYGO_VERSION}/${TINYGO_DEB}
        echo "${TINYGO_CHECKSUM}  ${TINYGO_DEB}" | sha256sum -c -
        sudo dpkg -i ${TINYGO_DEB}
        rm ${TINYGO_DEB}
    - name: Install semver tool
      shell: bash
      run: |
        SEMVER_VERSION="3.4.0"
        INSTALL_DIR="$HOME"/.semver
        mkdir -p "$INSTALL_DIR"
        wget -O "$INSTALL_DIR"/semver https://github.com/fsaintjacques/semver-tool/raw/837ad91179c4126e3b7ff73c35091d5ef561d9a3/src/semver
        chmod +x "$INSTALL_DIR"/semver
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
    - name: Install updatecli
      uses: updatecli/updatecli-action@93ae2608256484ef8598e902aa675bbc9e278e4e # v3.10.0
    - name: Install OPA
      shell: bash
      run: |
        set -e
        source "${GITHUB_ACTION_PATH}/../../../versions.env"
        INSTALL_DIR=$HOME/.opa
        mkdir -p $INSTALL_DIR
        curl -sL https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static -o $INSTALL_DIR/opa
        echo "${OPA_CHECKSUM}  $INSTALL_DIR/opa" | sha256sum -c -
        chmod 755 $INSTALL_DIR/opa
        echo $INSTALL_DIR >> $GITHUB_PATH
