on:
  workflow_dispatch:
    inputs:
      policy-working-dir:
        description: |
          Path of the policy directory, with the 'policies/' prefix. For
          example 'policies/sleeping-policy'.
        required: true
        type: string

name: Tag and release a policy manually

jobs:
  release-tag:
    name: Tag and push, triggering release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # also checkout tags

      - name: Extract version from metadata.yml
        id: extract-version
        shell: bash
        run: |
          POLICY_DIR="${{ inputs.policy-working-dir }}"
          POLICY_NAME=""
          FILES=("metadata.yml" "metadata.yaml")
          VERSION=""
          for F in "${FILES[@]}"; do
            FILE="$F"
            if [ -n "$POLICY_DIR" ]; then
              if [ -f "$POLICY_DIR" ]; then
                echo "The policy directory does not exists: $POLICY_DIR"
                exit 1
              fi
              FILE="$POLICY_DIR/$F"
              # policy dir can have multiple directories. Assume the last one
              # to be the policy-name
              POLICY_NAME="$(basename $POLICY_DIR)"
            fi
            if [ -f "$FILE" ]; then
              RAW_VERSION="$(yq e '.annotations."io.kubewarden.policy.version"' $FILE)"
              if [ -z "$RAW_VERSION" ]; then
                echo "annotation 'io.kubewarden.policy.version' is missing in $FILE"
                exit 1
              fi
              VERSION="v$RAW_VERSION"
              if  [ -n "$POLICY_NAME" ]; then
                VERSION="$POLICY_NAME/$VERSION"
              fi
              echo "found version $VERSION"
              echo "VERSION=$VERSION" >> $GITHUB_ENV
              echo "policy_name=$POLICY_NAME" >> $GITHUB_OUTPUT
              echo "raw_version=$RAW_VERSION" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "Error: metadata.yml or metadata.yaml not found" >&2
          exit 1

      # release-please expects every tag it has not seen to be newer than the
      # last one it read from .release-please-manifest.json. A manual release
      # that goes backward, or that leaves the manifest behind, makes
      # release-please propose a version that is already released, with
      # nothing downstream to catch it. These two checks make that mistake
      # fail here instead.
      - name: Refuse to tag a version lower than an existing tag
        shell: bash
        env:
          POLICY_NAME: ${{ steps.extract-version.outputs.policy_name }}
          RAW_VERSION: ${{ steps.extract-version.outputs.raw_version }}
        run: |
          LATEST_TAG="$(git tag -l "${POLICY_NAME}/v*" | sed "s#^${POLICY_NAME}/v##" | sort -V | tail -1)"
          if [ -z "$LATEST_TAG" ]; then
            echo "No existing tag for $POLICY_NAME, nothing to compare against"
            exit 0
          fi
          HIGHEST="$(printf '%s\n%s\n' "$LATEST_TAG" "$RAW_VERSION" | sort -V | tail -1)"
          if [ "$HIGHEST" != "$RAW_VERSION" ] || [ "$LATEST_TAG" == "$RAW_VERSION" ]; then
            echo "::error title=Version not higher::metadata.yml has $RAW_VERSION, the latest tag is $LATEST_TAG. The new version must be higher."
            exit 1
          fi

      - name: Refuse to tag when .release-please-manifest.json disagrees
        shell: bash
        env:
          POLICY_DIR: ${{ inputs.policy-working-dir }}
          RAW_VERSION: ${{ steps.extract-version.outputs.raw_version }}
        run: |
          MANIFEST_VERSION="$(jq -r --arg key "$POLICY_DIR" '.[$key]' .release-please-manifest.json)"
          if [ "$MANIFEST_VERSION" == "null" ] || [ -z "$MANIFEST_VERSION" ]; then
            echo "::error title=Missing manifest entry::.release-please-manifest.json has no entry for $POLICY_DIR"
            exit 1
          fi
          if [ "$MANIFEST_VERSION" != "$RAW_VERSION" ]; then
            echo "::error title=Manifest out of sync::.release-please-manifest.json has $MANIFEST_VERSION for $POLICY_DIR, metadata.yml has $RAW_VERSION. Update both together before a manual release, or release-please will propose a version that is already released."
            exit 1
          fi

      - name: Configure Git author
        run: |
          git config user.name "Kubewarden bot"
          git config user.email "cncf-kubewarden-maintainers@lists.cncf.io"

      - name: Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -a "$VERSION" -m "Release version $VERSION"
          git push origin "$VERSION"

      - name: Trigger release workflow
        run: gh workflow run release.yml --ref "$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
