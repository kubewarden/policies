on:
  schedule:
    - cron: "30 3 12 * *" # At 03:30 on day-of-month 12
  workflow_dispatch:
    inputs:
      policy-working-dir:
        description: |
          Policy directory under policies folder. 
          Keep empty to release all policies
        required: false
        type: string
        default: ""
      policy-version:
        description: |
          Release version of the policy, without 'v' prefix. Optional.
          Defaults to extracting the version from tag if tag present.
          E.g: tag "v0.1.0", policy-version=0.1.0
        required: false
        type: string
        default: ""

name: Trigger policy release

jobs:
  calculate-policy-matrix:
    runs-on: ubuntu-latest
    outputs:
      policy_working_dirs: ${{ steps.calculate-policy-dirs.outputs.policy_working_dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # checkout all tags
      - name: calculate which policies need a CI job
        id: calculate-policy-dirs
        shell: bash
        run: |
          if [ -z "${{inputs.policy-working-dir}}" ]; then
            # All policies must be released (scheduled run or workflow_dispatch with no specific policy)
            policies_working_dirs=($(find policies -maxdepth 2 -name Makefile -exec dirname '{}' \;))
          else
            policy_working_dir=policies/${{ inputs.policy-working-dir }}
            if [ ! -d "$policy_working_dir" ]; then
              echo "::error title=Invalid inputs::$policy_working_dir does not exist"
              exit 1;
            fi
            # Release a single policy
            policies_working_dirs=("$policy_working_dir")
          fi
          declare -p policies_working_dirs # for debug

          # This workflow never creates a tag. A tag comes from one of two places:
          #   - release-tag.yaml, after the merge of the PR that this workflow opens
          #   - a maintainer, by hand, for the first release of a policy
          # release-drafter computes the next version from the PRs merged since
          # the tag of the current version. Without that tag there is nothing
          # to compute from, so the policy is skipped.
          # An explicit policy-version input skips this check. The version
          # guard in the open-release-pr job still rejects a downgrade.
          if [ -z "${{ inputs.policy-version }}" ]; then
            tagged_policies_working_dirs=()
            for policy_working_dir in "${policies_working_dirs[@]}"; do
              policy_basename=$(basename "$policy_working_dir")
              policy_version=$(yq -r '.annotations."io.kubewarden.policy.version"' "$policy_working_dir/metadata.yml")
              if [ -z "$(git tag -l "$policy_basename/v$policy_version")" ]; then
                echo "::notice title=No tag for current version::$policy_basename v$policy_version has no tag, so it was never released from this repository. Push the tag $policy_basename/v$policy_version by hand to make the first release. Automation takes over from the next version."
                continue
              fi
              tagged_policies_working_dirs+=("$policy_working_dir")
            done
            policies_working_dirs=("${tagged_policies_working_dirs[@]}")
          fi

          policy_working_dirs=$(jq --compact-output --null-input \
            '$ARGS.positional | unique' \
            --args -- "${policies_working_dirs[@]}")

          echo "policy_working_dirs=$policy_working_dirs"
          echo "policy_working_dirs=$policy_working_dirs" >> $GITHUB_OUTPUT

  open-release-pr:
    name: "Open PR to release policy"
    runs-on: ubuntu-latest
    needs: calculate-policy-matrix
    # An empty matrix is an error for GitHub. Skip the job when every policy was filtered out.
    if: ${{ needs.calculate-policy-matrix.outputs.policy_working_dirs != '[]' }}
    strategy:
      fail-fast: false
      # limit the number of jobs to avoid rate limits errors from Github API
      max-parallel: 5
      matrix:
        policy-working-dir: ${{ fromJSON(needs.calculate-policy-matrix.outputs.policy_working_dirs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Install cargo-set-version
        run: cargo install cargo-edit --version 0.13.9 --locked

      - name: Get policy metadata
        id: policy-info
        uses: ./.github/actions/get-policy-metadata
        with:
          policy-working-dir: "${{ matrix.policy-working-dir }}"

      - name: Ensure that the requested version is not a downgrade
        if: ${{ inputs.policy-version != '' }}
        shell: bash
        run: |
          semver_result=$(semver compare ${{ steps.policy-info.outputs.policy-version }} ${{ inputs.policy-version }})
          if [ "$semver_result" == "1" ]; then
            echo "::error title=Invalid version::Cannot downgrade a policy version"
            exit 1
          fi

      # With an empty version input, release-drafter calculates the version
      # based on the PRs merged since the last release.
      - name: Create draft release and calculate version
        id: create-release
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          config-name: "release-drafter-${{ steps.policy-info.outputs.policy-basename }}.yml"
          version: ${{ inputs.policy-version }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Ensure that release drafter is not downgrading the policy version
        run: |
          semver_result=$(semver compare ${{ steps.policy-info.outputs.policy-version }} ${{ steps.create-release.outputs.resolved_version }}) 
          if [ "$semver_result" == "1" ]; then
            echo "::error title=Invalid version::Cannot downgrade a policy version"
            exit 1
          fi

      - name: Create values.yaml for Updatecli based on release drafter release and policy information
        run: |
          cat <<EOF > values.yaml
          github:
            owner: "${{ github.repository_owner }}"
            repo: "${{ github.event.repository.name }}"
          policy:
            version: "${{ steps.create-release.outputs.resolved_version}}"
            working_dir: "${{ matrix.policy-working-dir }}"
            rust_package: "${{ steps.policy-info.outputs.policy-rust-package }}"
            basename: "${{ steps.policy-info.outputs.policy-basename }}"
          EOF

      - name: Open PR with updatecli
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |-
          updatecli apply --config updatecli/updatecli.d/open-release-pr.yaml \
            --values updatecli/values.yaml \
            --values $(pwd)/values.yaml
