name: CI crates

on:
  push:
    paths:
      - "policies/crates/**"
  pull_request:
    paths:
      - "policies/crates/**"

jobs:
  calculate-crates-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List crate folders
        id: set-matrix
        run: |
          CRATES=$(ls -1 policies/crates | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix={\"crate\":$CRATES}" >> $GITHUB_OUTPUT

  check:
    needs: calculate-crates-matrix
    name: Check
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.calculate-crates-matrix.outputs.matrix)}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Run cargo check"
        run: |
          make -C policies/crates/${{ matrix.crate }} check

  test:
    needs: calculate-crates-matrix
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.calculate-crates-matrix.outputs.matrix)}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Run cargo test"
        run: |
          make -C policies/crates/${{ matrix.crate }} test

  fmt:
    needs: calculate-crates-matrix
    name: Rustfmt
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.calculate-crates-matrix.outputs.matrix)}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Run cargo fmt"
        run: |
          make -C policies/crates/${{ matrix.crate }} fmt

  clippy:
    needs: calculate-crates-matrix
    name: Clippy
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.calculate-crates-matrix.outputs.matrix)}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Run cargo clippy"
        run: |
          make -C policies/crates/${{ matrix.crate }} lint

  spelling:
    needs: calculate-crates-matrix
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.calculate-crates-matrix.outputs.matrix)}}
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install typos Spell check
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1
        with:
          files: policies/crates/${{ matrix.crate }}/**
