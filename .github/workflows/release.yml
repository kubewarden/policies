on:
  workflow_dispatch:
    inputs:
      policy-working-dir:
        description: |
          Bare policy directory name, without the 'policies/' prefix. Give this
          input when the workflow runs against a branch. That run builds the
          policy and publishes it with the ':latest' tag only. It creates no
          git tag and no GitHub release.

          A run against a tag ignores this input. The policy name and the
          version come from the tag name instead. release-please.yaml starts
          this kind of run automatically, with '--ref <tag>', once it tags a
          release. release-tag.yaml can also start one by hand, for a manual
          release.
        required: false
        type: string
        default: ""

name: Release policy

jobs:
  calculate-policy-from-tag:
    runs-on: ubuntu-latest
    outputs:
      policy-working-dir: ${{ steps.calculate-vars.outputs.policy_working_dir }}
      policy-version: ${{ steps.calculate-vars.outputs.policy_version }}
      policy-name: ${{ steps.calculate-vars.outputs.policy_name }}
      has-artifacthub-metadata: ${{ steps.calculate-vars.outputs.has_artifacthub_metadata }}
      skip-publishing: ${{ steps.calculate-vars.outputs.skip_publishing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: calculate-vars
        shell: bash
        run: |
          # This workflow runs against a tag or a branch. `github.ref` tells
          # us which, not `github.event_name`.
          #
          # A run against a tag is a full release. The policy name and the
          # version come from the tag name. Two triggers start this run:
          #   - a direct push of a '*/v*' tag
          #   - a workflow_dispatch that `release-tag.yaml` sends with
          #     `gh workflow run release.yml --ref <tag>`, with no input.
          #     GitHub fires no workflow for a tag pushed with GITHUB_TOKEN,
          #     so `release-tag.yaml` must start this run itself.
          #
          # A run against a branch only publishes the ':latest' tag. There is
          # no tag to read the policy name from, so it needs the
          # `policy-working-dir` input.
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]; then
            policy_name=$( echo ${{ github.ref_name }} | sed 's/\(.*\)\/\(.*\)$/\1/' )
          else
            policy_name='${{ inputs.policy-working-dir }}'
            if [ -z "$policy_name" ]; then
              echo "::error title=Missing input::this run needs the 'policy-working-dir' input, because it runs against a branch"
              exit 1;
            fi
          fi
          policy_working_dir=$( find policies -type d -name "$policy_name")

          policy_language=""
          if [ ! -d "$policy_working_dir" ]; then
            echo "::error title=Policy not found::there is no directory 'policies/$policy_name'"
            exit 1;
          fi

          policy_ociUrl=$(yq -r '.annotations."io.kubewarden.policy.ociUrl"' $policy_working_dir/metadata.yml)
          # `yq -r` prints the string "null" when the annotation is missing.
          # Without this check the policy is pushed to a repository named
          # "null", where it collides with every other policy that lacks the
          # annotation.
          if [ -z "$policy_ociUrl" ] || [ "$policy_ociUrl" == "null" ]; then
            echo "::error title=Missing annotation::$policy_working_dir/metadata.yml has no io.kubewarden.policy.ociUrl annotation"
            exit 1;
          fi
          # The CI reads only the last segment of the annotation. A namespace
          # other than "policies" has no effect on the push target, so it makes
          # the annotation disagree with the location of the policy.
          policy_namespace=$(basename $(dirname "$policy_ociUrl"))
          if [ "$policy_namespace" != "policies" ]; then
            echo "::error title=Invalid annotation::io.kubewarden.policy.ociUrl of $policy_working_dir uses the '$policy_namespace' namespace. Use 'policies'"
            exit 1;
          fi

          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]; then
            policy_version=$( echo ${{ github.ref_name }} | sed 's/\(.*\)\/\(.*\)$/\2/' | cut -c2- )
          else
            # A run against a branch has no tag. The version comes from metadata.yml instead.
            policy_version=$(yq -r '.annotations."io.kubewarden.policy.version"' $policy_working_dir/metadata.yml)
          fi

          echo "policy_name=$policy_name"
          echo "policy_working_dir=$policy_working_dir"
          echo "policy_version=$policy_version"

          echo "policy_name=$policy_name" >> $GITHUB_OUTPUT
          echo "policy_working_dir=$policy_working_dir" >> $GITHUB_OUTPUT
          echo "policy_version=$policy_version" >> $GITHUB_OUTPUT

          # Check for ArtifactHub metadata, to skip if none
          if yq -e '.annotations."io.artifacthub.displayName"' $policy_working_dir/metadata.yml >/dev/null; then
            echo "has_artifacthub_metadata=true" >> $GITHUB_OUTPUT
          else
            echo "has_artifacthub_metadata=false" >> $GITHUB_OUTPUT
          fi

          # Policies that should not be published to ArtifactHub or the policy-catalog.
          # They still receive a GitHub Release and OCI package.
          EXCLUDED_FROM_PUBLISHING=(
            "context-aware-demo"
            "go-wasi-context-aware-test-policy"
            "raw-mutation-policy"
            "raw-mutation-wasi-policy"
            "raw-validation-opa-policy"
            "raw-validation-policy"
            "raw-validation-wasi-policy"
            "sleeping-policy"
          )
          skip_publishing=false
          for excluded in "${EXCLUDED_FROM_PUBLISHING[@]}"; do
            if [ "$policy_name" == "$excluded" ]; then
              skip_publishing=true
              break
            fi
          done
          echo "skip_publishing=$skip_publishing" >> $GITHUB_OUTPUT

  ci:
    uses: ./.github/workflows/reusable-ci.yaml
    needs: calculate-policy-from-tag
    with:
      policy-working-dir: ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}

  pre-release-checks:
    name: "Pre release checks"
    runs-on: ubuntu-latest
    needs: [calculate-policy-from-tag]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that `io.kubewarden.policy.version` annotation is up-to-date
        shell: bash
        working-directory: ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}
        run: |
          VERSION=$(grep 'io.kubewarden.policy.version' metadata.yml | awk '{print $2}' | tr -d '"')
          if [ "$VERSION" != "${{ needs.calculate-policy-from-tag.outputs.policy-version  }}" ]; then
            echo "The value of io.kubewarden.policy.version annotation is not in sync with the expected version: '${VERSION}' != '${{  needs.calculate-policy-from-tag.outputs.policy-version  }}'"
            exit 1
          fi

  release:
    runs-on: ubuntu-latest
    # needs: [calculate-policy-from-tag, ci, pre-release-checks]
    needs: [calculate-policy-from-tag, pre-release-checks, ci]
    permissions:
      # Required to create GH releases
      contents: write
      # Required to push to GHCR
      packages: write
      # Required by cosign keyless signing
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs before `kwctl annotate`, so that the Wasm module carries the URL
      # to which this workflow publishes the policy.
      - name: Set the policy OCI URL
        id: oci
        uses: ./.github/actions/set-policy-oci-url
        with:
          policy-working-dir: ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}
          oci-base: ${{ vars.POLICIES_OCI_BASE }}

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build Wasm module
        shell: bash
        run: make -C ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }} policy.wasm

      - name: Annotate Wasm module
        shell: bash
        run: |
          make -C ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }} annotated-policy.wasm

      - name: Generate the SBOM files
        shell: bash
        working-directory: ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}
        run: |
          # SBOM files should have "sbom" in the name due the CLO monitor
          # https://clomonitor.io/docs/topics/checks/#software-bill-of-materials-sbom
          syft scan --output spdx-json=policy-sbom.spdx.json \
            --source-name $(yq '.annotations["io.kubewarden.policy.title"] + "-" + .annotations["io.kubewarden.policy.version"]' metadata.yml) \
            --source-version ${{ github.sha }} \
            -vv dir:.

      - name: Sign BOM file
        shell: bash
        working-directory: ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}
        run: |
          cosign sign-blob --yes \
            --bundle policy-sbom.spdx.jsonl.bundle.sigstore \
            policy-sbom.spdx.json

      - name: Upload policy SBOM files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: policy-sbom
          path: |
            ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}/policy-sbom.spdx.json
            ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}/policy-sbom.spdx.jsonl.bundle.sigstore

      # The upstream repository and forks on GitHub publish to GHCR, and the
      # token of the workflow gives access to it.
      - name: Login to GitHub Container Registry
        if: ${{ vars.POLICIES_OCI_BASE == '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.oci.outputs.registry }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A fork that publishes to another registry gives its own credentials.
      - name: Login to the configured OCI registry
        if: ${{ vars.POLICIES_OCI_BASE != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.oci.outputs.registry }}
          username: ${{ secrets.POLICIES_OCI_USERNAME }}
          password: ${{ secrets.POLICIES_OCI_PASSWORD }}

      - name: Publish Wasm policy artifact to OCI registry with the 'latest' tag
        shell: bash
        if: ${{ startsWith(github.ref, 'refs/heads/') }}
        working-directory: ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}
        run: |
          set -ex
          echo Pushing :latest policy to OCI container registry
          IMMUTABLE_REF=$(kwctl push -o json annotated-policy.wasm ${{ steps.oci.outputs.oci-url }}:latest | jq -r .immutable_ref)

          echo Keyless signing of policy using cosign

          # We need to disable the new bundle format enabled by default since 
          # cosign v3.x.x because some verification tools (e.g. slsactl) are not
          # able to properly verify the signatures using this new format
          cosign sign --yes --new-bundle-format=false --use-signing-config=false ${IMMUTABLE_REF}

          # Sign also with cosign v3 signature format
          cosign sign --yes --new-bundle-format=true --use-signing-config=true ${IMMUTABLE_REF}

      - name: Publish Wasm policy artifact to OCI registry with the version tag
        shell: bash
        if: ${{ ! startsWith(github.ref, 'refs/heads/') }}
        working-directory: ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}
        run: |
          set -ex
          export OCI_TAG="v${{ needs.calculate-policy-from-tag.outputs.policy-version }}"

          echo Pushing tagged policy to OCI container registry
          IMMUTABLE_REF=$(kwctl push -o json annotated-policy.wasm ${{ steps.oci.outputs.oci-url }}:${OCI_TAG} | jq -r .immutable_ref)

          echo Keyless signing of policy using cosign

          # We need to disable the new bundle format enabled by default since 
          # cosign v3.x.x because some verification tools (e.g. slsactl) are not
          # able to properly verify the signatures using this new format
          cosign sign --yes --new-bundle-format=false --use-signing-config=false ${IMMUTABLE_REF}

          # Sign also with cosign v3 signature format
          cosign sign --yes --new-bundle-format=true --use-signing-config=true ${IMMUTABLE_REF}

      # A manual run publishes the ':latest' tag only. A GitHub release needs a
      # tag, and a manual run does not create one.
      #
      # A run against a tag started by release-please.yaml already has a
      # draft release, made by release-please itself. A run started by hand
      # through release-tag.yaml has no release yet, since that workflow only
      # pushes the tag. Create one in that case, so the two paths converge.
      - name: Ensure a release exists
        if: ${{ ! startsWith(github.ref, 'refs/heads/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --title "$TAG_NAME" --draft --generate-notes
          fi

      - name: Upload release assets
        if: ${{ ! startsWith(github.ref, 'refs/heads/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          POLICY_WORKING_DIR: ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}
        run: |
          gh release upload "$TAG_NAME" \
            "$POLICY_WORKING_DIR/policy.wasm" \
            "$POLICY_WORKING_DIR/policy-sbom.spdx.json" \
            "$POLICY_WORKING_DIR/policy-sbom.spdx.jsonl.bundle.sigstore"

      - name: Publish the release
        if: ${{ ! startsWith(github.ref, 'refs/heads/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          POLICY_VERSION: ${{ needs.calculate-policy-from-tag.outputs.policy-version }}
        run: |
          EXTRA_FLAGS=(--draft=false --latest)
          case "$POLICY_VERSION" in
            *-alpha*|*-beta*|*-rc*) EXTRA_FLAGS=(--draft=false --prerelease --latest=false) ;;
          esac

          gh release edit "$TAG_NAME" "${EXTRA_FLAGS[@]}"

  push-artifacthub:
    if: |
      ! startsWith(github.ref, 'refs/heads/') &&
      needs.calculate-policy-from-tag.outputs.has-artifacthub-metadata == 'true' &&
      needs.calculate-policy-from-tag.outputs.skip-publishing != 'true'
    needs: [calculate-policy-from-tag, release]
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      group: artifacthub-branch-updates
      queue: max
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # fetch all history for all branches and tags

      - name: install dependencies
        uses: ./.github/actions/install-dependencies

      # Runs before `kwctl scaffold artifacthub`, so that artifacthub-pkg.yml
      # gives users the URL from which they can pull the policy.
      - name: Set the policy OCI URL
        uses: ./.github/actions/set-policy-oci-url
        with:
          policy-working-dir: ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}
          oci-base: ${{ vars.POLICIES_OCI_BASE }}

      - name: generate artifacthub-pkg.yml
        shell: bash
        working-directory: ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}
        run: |
          kwctl scaffold artifacthub --output ${{ runner.temp }}/artifacthub-pkg.yml

      - name: Push up-to-date artifacthub-pkg.yml
        id: artifacthub-push
        shell: bash
        run: |
          set -x
          git config user.name "Update artifacthub branch"
          git config user.email github-actions@github.com

          git checkout -b main --track origin/main
          git checkout -b artifacthub --track origin/artifacthub || git checkout --orphan artifacthub
          git reset HEAD -- .
          # we need to replicate the policy-working-dir structure,
          # see https://artifacthub.io/docs/topics/repositories/kubewarden-policies
          #   path/to/packages
          #   └── policies
          #       └── <policy name>
          #           ├── artifacthub-pkg.yml
          #           └── README.md
            
          # checkout the specific files we need from the specific tag that triggered this workflow:
          git checkout ${{ github.ref_name }} -- artifacthub-repo.yml
          mkdir -p ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}
          mv ${{ runner.temp }}/artifacthub-pkg.yml ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}/artifacthub-pkg.yml
          git checkout ${{ github.ref_name }} -- ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}/README.md

          # add and commit the needed files:
          git add artifacthub-repo.yml
          git add ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}/artifacthub-pkg.yml
          git add ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}/README.md # used if artifacthub-pkg.yml.readme is missing
          VERSION=$(sed --posix -n 's,^version: \(.*\),\1,p' ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}/artifacthub-pkg.yml)
          git commit -m "Bump ArtifactHub files for ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}, version $VERSION"

          # The ArtifactHub branch is updated by many release runs. The job
          # concurrency group serializes normal releases; keep the rebase retry
          # for any out-of-band branch update that lands while this job runs.
          for i in {1..5}; do
            git pull --rebase origin artifacthub
            if git push origin artifacthub; then
              break
            else
              echo "Push failed, retrying in 5s..."
              sleep 5
            fi
          done || { echo "Failed to push to artifacthub branch after 5 retries"; exit 1; }

  release-catalog:
    if: |
      github.repository_owner == 'kubewarden' &&
      needs.calculate-policy-from-tag.outputs.skip-publishing != 'true'
    needs: [calculate-policy-from-tag, release, push-artifacthub]
    uses: kubewarden/github-actions/.github/workflows/reusable-release-policy-catalog.yml@143b9e4b11ddc47370482267383586e6f1bc7efe # v7.0.1
    with:
      policy-name: ${{ needs.calculate-policy-from-tag.outputs.policy-name }}
      policy-working-dir: ${{ needs.calculate-policy-from-tag.outputs.policy-working-dir }}
    secrets:
      # Required to dispatch the release event to the policy-catalog repository
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
