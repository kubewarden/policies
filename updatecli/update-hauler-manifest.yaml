name: Update Hauler manifest

policies:
  - name: Reconcile hauler_manifest.yaml with published policy versions
    # TODO: switch to ghcr.io/updatecli/policies/hauler/manifest once the
    # upstream policy (https://github.com/updatecli/policies) is merged and
    # published. For now this points at a fork used to develop the policy.
    policy: ghcr.io/jvanz/updatecli/policies/hauler/manifest:0.1.0
    values:
      # Generated by `make hauler-values` (hack/generate-hauler-values.sh).
      # Not committed: it is specific to the repository (fork or upstream)
      # the workflow runs in. See CONTRIBUTING.md.
      - ./values/hauler-manifest.generated.yaml
