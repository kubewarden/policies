# Kubewarden Artifacthub Package config
#
# Use this config to submit the policy to https://artifacthub.io.
#
# This config can be saved to its default location with:
#   kwctl scaffold artifacthub > artifacthub-pkg.yml 
version: 1.0.4
name: network-allow-egress-traffic-from-namespace-to-another
displayName: Network Allow Egress Traffic From Namespace To Another
createdAt: 2026-10-12T04:40:30.726234944Z
description: "If you are using a CNI that allows for Network Policies, you can use this Policy to allow Egress traffic from one namespace to another.\n\nBy default, if no policies exist in a namespace, then all ingress and egress traffic is allowed to and from pods in that namespace. \n"
license: Apache-2.0
homeURL: https://github.com/kubewarden/policies
containersImages:
- name: policy
  image: ghcr.io/kubewarden/policies/network-allow-egress-traffic-from-namespace-to-another:v1.0.4
links:
- name: policy
  url: https://github.com/kubewarden/policies/releases/download/v1.0.4/policy.wasm
- name: source
  url: https://github.com/kubewarden/policies
install: |
  The policy can be obtained using [`kwctl`](https://github.com/kubewarden/kwctl):
  ```console
  kwctl pull ghcr.io/kubewarden/policies/network-allow-egress-traffic-from-namespace-to-another:v1.0.4
  ```
  Then, generate the policy manifest and tune it to your liking. For example:
  ```console
  kwctl scaffold manifest -t ClusterAdmissionPolicy registry://ghcr.io/kubewarden/policies/network-allow-egress-traffic-from-namespace-to-another:v1.0.4
  ```
maintainers:
- name: Kubewarden developers
  email: cncf-kubewarden-maintainers@lists.cncf.io
provider:
  name: kubewarden
recommendations:
- url: https://artifacthub.io/packages/helm/kubewarden/kubewarden-controller
annotations:
  kubewarden/mutation: 'false'
  kubewarden/questions-ui: |
    questions:
      - variable: src_namespace
        default:
        required: true
        group: Settings
        type: string
        label: Src namespace
      - variable: dst_namespace
        default:
        required: true
        group: Settings
        type: string
        label: Dst namespace
  kubewarden/resources: NetworkPolicy
  kubewarden/rules: |
    - apiGroups:
      - networking.k8s.io
      apiVersions:
      - v1
      resources:
      - networkpolicies
      operations:
      - CREATE
      - UPDATE
