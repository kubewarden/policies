# Kubewarden Artifacthub Package config
#
# Use this config to submit the policy to https://artifacthub.io.
#
# This config can be saved to its default location with:
#   kwctl scaffold artifacthub > artifacthub-pkg.yml 
version: 1.0.5
name: istio-gateway-approved-hosts
displayName: Istio Gateway Approved Hosts
createdAt: 2026-10-14T13:21:56.524816986Z
description: "### Istio Gateway Approved Hosts\nThis ensures you are only serving traffic for approved hostnames. \n"
license: Apache-2.0
homeURL: https://github.com/kubewarden/policies
containersImages:
- name: policy
  image: ghcr.io/kubewarden/policies/istio-gateway-approved-hosts:v1.0.5
links:
- name: policy
  url: https://github.com/kubewarden/policies/releases/download/v1.0.5/policy.wasm
- name: source
  url: https://github.com/kubewarden/policies
install: |
  The policy can be obtained using [`kwctl`](https://github.com/kubewarden/kwctl):
  ```console
  kwctl pull ghcr.io/kubewarden/policies/istio-gateway-approved-hosts:v1.0.5
  ```
  Then, generate the policy manifest and tune it to your liking. For example:
  ```console
  kwctl scaffold manifest -t ClusterAdmissionPolicy registry://ghcr.io/kubewarden/policies/istio-gateway-approved-hosts:v1.0.5
  ```
maintainers:
- name: Kubewarden developers
  email: cncf-kubewarden-maintainers@lists.cncf.io
provider:
  name: kubewarden
recommendations:
- url: https://artifacthub.io/packages/helm/kubewarden/kubewarden-controller
annotations:
  kubewarden/mutation: 'false'
  kubewarden/questions-ui: |
    questions:
      - variable: hostnames
        default:
        required: true
        group: Settings
        type: array[
        label: Hostnames
  kubewarden/resources: Gateway
  kubewarden/rules: |
    - apiGroups:
      - networking.istio.io
      apiVersions:
      - v1
      resources:
      - gateways
      operations:
      - CREATE
      - UPDATE
