# Kubewarden Artifacthub Package config
#
# Use this config to submit the policy to https://artifacthub.io.
#
# This config can be saved to its default location with:
#   kwctl scaffold artifacthub > artifacthub-pkg.yml 
version: 1.0.5
name: helm-release-remediation-retries
displayName: Helm Release Remediation Retries
createdAt: 2026-10-12T04:22:38.369344626Z
description: HelmRelease remediation retries must be within the specified lower and upper bounds.
license: Apache-2.0
homeURL: https://github.com/kubewarden/policies
containersImages:
- name: policy
  image: ghcr.io/kubewarden/policies/helm-release-remediation-retries:v1.0.5
keywords:
- flux
links:
- name: policy
  url: https://github.com/kubewarden/policies/releases/download/v1.0.5/policy.wasm
- name: source
  url: https://github.com/kubewarden/policies
install: |
  The policy can be obtained using [`kwctl`](https://github.com/kubewarden/kwctl):
  ```console
  kwctl pull ghcr.io/kubewarden/policies/helm-release-remediation-retries:v1.0.5
  ```
  Then, generate the policy manifest and tune it to your liking. For example:
  ```console
  kwctl scaffold manifest -t ClusterAdmissionPolicy registry://ghcr.io/kubewarden/policies/helm-release-remediation-retries:v1.0.5
  ```
maintainers:
- name: Kubewarden developers
  email: cncf-kubewarden-maintainers@lists.cncf.io
provider:
  name: kubewarden
recommendations:
- url: https://artifacthub.io/packages/helm/kubewarden/kubewarden-controller
annotations:
  kubewarden/mutation: 'false'
  kubewarden/questions-ui: |
    questions:
      - variable: lower_bound
        default: 1
        required: true
        group: Settings
        type: int
        label: Lower bound
      - variable: upper_bound
        default: 10
        required: true
        group: Settings
        type: int
        label: Upper bound
  kubewarden/resources: HelmRelease
  kubewarden/rules: |
    - apiGroups:
      - helm.toolkit.fluxcd.io
      apiVersions:
      - v2
      resources:
      - helmreleases
      operations:
      - CREATE
      - UPDATE
