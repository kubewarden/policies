# Kubewarden Artifacthub Package config
#
# Use this config to submit the policy to https://artifacthub.io.
#
# This config can be saved to its default location with:
#   kwctl scaffold artifacthub > artifacthub-pkg.yml 
version: 1.0.5
name: helm-chart-cosign-verification
displayName: HelmChart Cosign Verification
createdAt: 2026-10-14T13:39:22.749445713Z
description: HelmChart objects must provide cosign verification and reference a secret containing the Cosign public keys of trusted authors
license: Apache-2.0
homeURL: https://github.com/kubewarden/policies
containersImages:
- name: policy
  image: ghcr.io/kubewarden/policies/helm-chart-cosign-verification:v1.0.5
keywords:
- flux
links:
- name: policy
  url: https://github.com/kubewarden/policies/releases/download/v1.0.5/policy.wasm
- name: source
  url: https://github.com/kubewarden/policies
install: |
  The policy can be obtained using [`kwctl`](https://github.com/kubewarden/kwctl):
  ```console
  kwctl pull ghcr.io/kubewarden/policies/helm-chart-cosign-verification:v1.0.5
  ```
  Then, generate the policy manifest and tune it to your liking. For example:
  ```console
  kwctl scaffold manifest -t ClusterAdmissionPolicy registry://ghcr.io/kubewarden/policies/helm-chart-cosign-verification:v1.0.5
  ```
maintainers:
- name: Kubewarden developers
  email: cncf-kubewarden-maintainers@lists.cncf.io
provider:
  name: kubewarden
recommendations:
- url: https://artifacthub.io/packages/helm/kubewarden/kubewarden-controller
annotations:
  kubewarden/mutation: 'false'
  kubewarden/resources: HelmChart
  kubewarden/rules: |
    - apiGroups:
      - source.toolkit.fluxcd.io
      apiVersions:
      - v1
      resources:
      - helmcharts
      operations:
      - CREATE
      - UPDATE
